<!DOCTYPE html>
<html lang="en">
<head>

<body>

<header>
    <h1>Infinity Learning - Admin Settings</h1>
</header>

<section class="hero">
    <h2>System Settings & Configuration</h2>
    <p>Configure page access and system behavior</p>
</section>

<section class="login-box">

    <div id="settingsPanel" class="settings-panel">
        <h2>System Settings</h2>
        
        <div class="settings-menu">
            <button type="button" data-action="page-sequence-settings">Page Sequence Order</button>
            <button type="button" data-action="interference-settings">Interference Control</button>
            <button type="button" data-action="feature-toggle">Feature Toggles</button>
            <button type="button" data-action="back-to-admin">Back to Admin</button>
        </div>

        <div id="settingsContent" class="settings-content"></div>

    </div>

</section>

<footer>
