<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
    <meta name="referrer" content="same-origin">
    <title>Admin Panel - Infinity Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Infinity Learning - Admin Panel</h1>
</header>

<section class="hero">
    <h2>Admin Dashboard</h2>
    <p>Manage all users and system settings</p>
</section>

<section class="login-box">

    <div id="adminLoginSection" class="admin-login-section">
        <h2>🔐 Admin Login</h2>
        <form id="adminLoginForm">
            <input type="email" id="adminEmail" name="adminEmail" placeholder="Admin Email" required>
            <br><br>
            <input type="password" id="adminPassword" name="adminPassword" placeholder="Admin Password" required>
            <br><br>
            <button type="submit">Login as Admin</button>
        </form>
        <p style="margin-top: 20px; color: #666; font-size: 13px; border-top: 1px solid #ddd; padding-top: 15px;">
            <strong>Demo Credentials:</strong><br>
            📧 Email: admin@infinity.com<br>
            🔑 Password: admin123
        </p>
    </div>

    <div id="adminPanel" class="admin-panel login-hidden">
        <h2>🎛️ Admin Control Panel</h2>
        
        <div class="admin-dashboard-nav">
            <button type="button" class="admin-nav-btn" data-action="dashboard-home">📊 Dashboard</button>
            <button type="button" class="admin-nav-btn" data-action="view-all-students">👨‍🎓 All Students</button>
            <button type="button" class="admin-nav-btn" data-action="view-all-teachers">👨‍🏫 All Teachers</button>
            <button type="button" class="admin-nav-btn" data-action="page-layout-settings">📐 Layout Settings</button>
            <button type="button" class="admin-nav-btn" data-action="interference-settings">⚙️ Interference</button>
            <button type="button" class="admin-nav-btn" data-action="export-all-data">📥 Export Data</button>
            <button type="button" class="admin-nav-btn logout-btn" data-action="admin-logout">🚪 Logout</button>
        </div>

        <div id="adminContent" class="admin-content"></div>
    </div>

</section>

<footer>
    <p>© 2026 Infinity Learning | All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
